services:
  backend:
    build: ./backend
    environment:
      ECHOMIND_MODE: demo
      ECHOMIND_STORAGE: local
      ECHOMIND_DB_PATH: /app/runtime/finance.sqlite3
      PROMETHEUS_PORT: "0"
    volumes:
      - finance-data:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  finance-data:
